# Alembic configuration for tcsh-ar-api.
#
# Actual sqlalchemy.url is overridden at runtime by alembic/env.py from
# tcsh_ar_api.config.Settings (which reads .env). The placeholder below
# only matters for `alembic --sql` offline mode.

[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url = sqlite+aiosqlite:///./tcsh.db
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(slug)s
version_path_separator = os
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
