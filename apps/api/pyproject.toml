[tool.poetry]
name = "tcsh-ar-api"
version = "0.1.0"
description = "FastAPI backend for the tcsh-web-ar AR installation."
authors = ["tcsh-web-ar contributors"]
readme = "README.md"
package-mode = true
packages = [{ include = "tcsh_ar_api", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.30.0"
alembic = "^1.13.3"
httpx = "^0.27.2"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
supabase = "^2.9.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.7.0"
mypy = "^1.13.0"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tcsh_ar_api"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
