[project]
name = "tcsh-ar-api"
version = "0.1.0"
description = "FastAPI backend for the tcsh-web-ar AR installation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "tcsh-web-ar contributors" },
]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.13.3,<2.0.0",
    "httpx>=0.27.2,<0.28.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "supabase>=2.9.1,<3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0,<0.8.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcsh_ar_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tcsh_ar_api"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
