name: review

# AI code review for tcsh-web-ar.
#
# `pull_request: labeled` doesn't fire when the label is set by another
# workflow using GITHUB_TOKEN (GitHub's built-in loop guard). Chain off
# `workflow_run` from ci.yml's success instead — ci.yml's `label` job
# attaches the `ai-review` label after all gates pass.
#
# Manual re-trigger is supported via gh CLI or the Actions UI on a
# specific PR.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # Serialise reviews per PR so a re-trigger doesn't race with an in-flight
  # session. Prefix with event_name so a branch literally named "17" can't
  # collide with PR #17.
  group: review-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve PR number
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.derive.outputs.pr }}
      proceed: ${{ steps.derive.outputs.proceed }}
    steps:
      - id: derive
        env:
          # BOT_PAT (with `repo` + `workflow` scopes) is preferred over
          # GITHUB_TOKEN so that label changes made by this workflow can
          # trigger downstream workflows (e.g. an `ai-fix` chain). GitHub
          # suppresses events generated by GITHUB_TOKEN; a PAT is treated
          # as a user event. Falls back to GITHUB_TOKEN if BOT_PAT is
          # not configured.
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          # Pass the event as env to avoid heredoc escape issues if the
          # payload contains a single quote.
          EVENT_JSON: ${{ toJson(github.event) }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$INPUT_PR"
            # Reject draft PRs on the manual path; ci.yml's label job
            # already filters drafts on the automated path.
            IS_DRAFT=$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "::notice::PR #$PR is a draft — skipping review"
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            # workflow_run path: read the associated PR from the event payload
            PR=$(printf '%s' "$EVENT_JSON" | jq -r '.workflow_run.pull_requests[0].number // empty')
            if [ -z "$PR" ]; then
              echo "::warning::workflow_run had no associated PR — skipping"
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          # Skip if PR is already merged / closed — a review run may have
          # queued while PR was open but ran after merge. Reviewing a merged
          # PR wastes runner cycles and leaves comments nobody will action.
          PR_STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state')
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "::notice::PR #$PR is $PR_STATE (not OPEN) — skipping review"
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Verify PR has ai-review label (signal from ci.yml that review
          # is wanted). Manual workflow_dispatch may not have the label;
          # we still proceed in that case.
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            HAS_LABEL=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -c '^ai-review$' || true)
            if [ "$HAS_LABEL" -eq 0 ]; then
              echo "::notice::PR #$PR has no ai-review label — skipping"
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "pr=$PR" >> $GITHUB_OUTPUT
          echo "proceed=true" >> $GITHUB_OUTPUT

  review:
    name: AI review (claude CLI)
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr }}
      REPO: ${{ github.repository }}
    steps:
      - name: Get PR head SHA
        id: prinfo
        run: |
          SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.prinfo.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node (for claude CLI install)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run AI review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_CONTEXT_PATH: REVIEW.md
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/ai-review.sh
          .github/scripts/ai-review.sh

      - name: Always remove ai-review label (success or fail)
        if: always()
        run: |
          # gh pr edit --remove-label silently fails on this repo (Projects-classic GraphQL).
          set +e; gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/ai-review" >/dev/null 2>&1; exit 0

      - name: Notify on failure
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "⚠️ AI \`/review\` session failed in CI. See workflow run logs. Push a new commit (or re-run via Actions UI) to retrigger."
