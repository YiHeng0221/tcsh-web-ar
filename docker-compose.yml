# Docker Compose — dev/demo environment.
#
# Runs the FastAPI backend and the nginx-served React build in containers.
# For day-to-day development we recommend `make dev` (native uv + Bun)
# for faster iteration; `make docker-up` is for reproducing the production
# build locally or sharing a single-command setup.

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tcsh_api
    env_file:
      - ./apps/api/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: tcsh_web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
